<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Product list with cart</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="container">
      <main class="products-section">
        <h1>Desserts</h1>

        <div class="product-grid" id="product-grid">
          <!-- Dynamically generated or static product items -->
          <article class="product-card">
            <div class="image-wrapper">
              <picture>
                <source
                  srcset="./assets/images/image-waffle-desktop.jpg"
                  media="(min-width: 1024px)"
                />
                <source
                  srcset="./assets/images/image-waffle-tablet.jpg"
                  media="(min-width: 768px)"
                />
                <img
                  src="./assets/images/image-waffle-mobile.jpg"
                  alt="Waffle with Berries"
                  class="product-img"
                />
              </picture>
              <button class="btn-add-cart">
                <img
                  src="./assets/images/icon-add-to-cart.svg"
                  alt=""
                  aria-hidden="true"
                />
                Add to Cart
              </button>
            </div>
            <div class="product-info">
              <span class="category">Waffle</span>
              <h2 class="product-title">Waffle with Berries</h2>
              <span class="price">$6.50</span>
            </div>
          </article>

          <!-- Additional products follow the same article structure -->
        </div>
      </main>

      <aside class="cart-section">
        <h2>Your Cart (<span id="cart-count">0</span>)</h2>
        <div class="cart-empty" id="cart-empty">
          <img
            src="./assets/images/illustration-empty-cart.svg"
            alt=""
            aria-hidden="true"
          />
          <p>Your added items will appear here</p>
        </div>
        <div class="cart-items hidden" id="cart-items">
          <!-- Populated dynamically via JS -->
        </div>
      </aside>
    </div>
  </body>
</html>
