<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
  </head>
  <body>
    <script>
      let celsius = 25;
      // convert to fahrenheit
      // using F = (C × 9/5) + 32
      let fahrenheit = (celsius * 9) / 5 + 32;
      console.log(fahrenheit);
      //   Area of a Rectangle
      let length = 10;
      let width = 5;
      // calculate area
      let area = length * width;
      console.log(area);
      //   Simple Interest Calculator
      //   SI = (P × R × T) / 100
      let principal = 10000;
      let rate = 5; // 5%
      let time = 5;

      let interest = (principal * rate * time) / 100;
      console.log(interest); // 2500
    </script>
  </body>
</html>
