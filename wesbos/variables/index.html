<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Variables</title>
  </head>
  <body>
    <script>
      let a = 5;
      let b = 10;
      // swap values without using a third variable
      [a, b] = [b, a];
      console.log(a, b);
      let d = 1,
        e = 2,
        f = 3;
      [d, e, f] = [f, e, d];
      console.log(d, e, f);
    </script>
  </body>
</html>
