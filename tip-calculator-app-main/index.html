<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Tip calculator app</title>

    <link rel="stylesheet" href="global.css" />
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1>
          SPLI
          <span>TTER</span>
        </h1>
      </header>
      <main>
        <section>
          <form action="">
            <fieldset>
              <label for="bill">Bill</label>
              <div>
                <img src="images/icon-dollar.svg" alt="dollar icon" />
                <input type="text" />
              </div>
            </fieldset>
            <fieldset>Select Tip % 5% 10% 15% 25% 50% Custom</fieldset>
            <fieldset>Number of People</fieldset>
          </form>
        </section>
        <section>Tip Amount / person Total / person Reset</section>
      </main>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Alokananda Y</a>.
    </footer>
  </body>
</html>
