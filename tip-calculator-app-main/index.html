<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A simple and responsive tip calculator that calculates the tip and total cost per person."
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Tip Calculator | Split the Bill and Calculate Tip Per Person</title>

    <link rel="stylesheet" href="global.css" />
  </head>

  <body>
    <div class="page stack stack-600">
      <header class="site-header">
        <h1 class="site-header__logo" aria-label="Splitter">
          SPLI<span class="site-header__logo-accent">TTER</span>
        </h1>
      </header>

      <main class="calculator surface" id="tip-calculator">
        <section
          class="calculator__form-section"
          aria-labelledby="calculator-title"
        >

          <form class="calculator__form" id="calculator-form">
            <!-- Bill -->
            <fieldset class="calculator__field">
              <label class="calculator__label" for="bill"> Bill </label>

              <div class="calculator__input-wrapper">
                <img
                  class="calculator__input-icon"
                  src="./images/icon-dollar.svg"
                  alt=""
                  aria-hidden="true"
                />

                <input
                  class="calculator__input"
                  type="number"
                  id="bill"
                  name="bill"
                  placeholder="0"
                  min="0"
                  step="0.01"
                  inputmode="decimal"
                  autocomplete="off"
                  required
                />
              </div>
            </fieldset>

            <!-- Tip -->
            <fieldset class="calculator__field calculator__field--tip">
              <legend class="calculator__label">Select Tip %</legend>

              <div
                class="calculator__tip-options"
                role="group"
                aria-label="Select tip percentage"
              >
                <button
                  class="calculator__tip-button"
                  type="button"
                  value="5"
                  aria-pressed="false"
                >
                  5%
                </button>

                <button
                  class="calculator__tip-button"
                  type="button"
                  value="10"
                  aria-pressed="false"
                >
                  10%
                </button>

                <button
                  class="calculator__tip-button"
                  type="button"
                  value="15"
                  aria-pressed="false"
                >
                  15%
                </button>

                <button
                  class="calculator__tip-button"
                  type="button"
                  value="25"
                  aria-pressed="false"
                >
                  25%
                </button>

                <button
                  class="calculator__tip-button"
                  type="button"
                  value="50"
                  aria-pressed="false"
                >
                  50%
                </button>

                <label class="calculator__custom-tip">
                  <span class="sr-only">Custom tip percentage</span>

                  <input
                    class="calculator__custom-tip-input"
                    type="number"
                    name="custom-tip"
                    placeholder="Custom"
                    min="0"
                    max="100"
                    step="1"
                    inputmode="numeric"
                  />
                </label>
              </div>
            </fieldset>

            <!-- Number of people -->
            <fieldset class="calculator__field">
              <label class="calculator__label" for="people">
                Number of People
              </label>

              <div class="calculator__input-wrapper">
                <img
                  class="calculator__input-icon"
                  src="./images/icon-person.svg"
                  alt=""
                  aria-hidden="true"
                />

                <input
                  class="calculator__input"
                  type="number"
                  id="people"
                  name="people"
                  placeholder="0"
                  min="1"
                  step="1"
                  inputmode="numeric"
                  autocomplete="off"
                  required
                />
              </div>
            </fieldset>
          </form>
        </section>

        <!-- Results -->
        <section class="calculator__results" aria-label="Calculation results">
          <div class="calculator__result">
            <div class="calculator__result-label">
              <h2 class="calculator__result-title">Tip Amount</h2>
              <span class="calculator__result-per-person"> / person </span>
            </div>

            <output
              class="calculator__result-value"
              id="tip-amount"
              for="bill people"
              aria-live="polite"
            >
              $0.00
            </output>
          </div>

          <div class="calculator__result">
            <div class="calculator__result-label">
              <h2 class="calculator__result-title">Total</h2>
              <span class="calculator__result-per-person"> / person </span>
            </div>

            <output
              class="calculator__result-value"
              id="total-amount"
              for="bill people"
              aria-live="polite"
            >
              $0.00
            </output>
          </div>

          <button class="calculator__reset" type="reset" form="calculator-form">
            Reset
          </button>
        </section>
      </main>

      <footer class="site-footer">
        <p class="site-footer__attribution">
          Challenge by
          <a
            class="site-footer__link"
            href="https://www.frontendmentor.io?ref=challenge"
            target="_blank"
            rel="noopener noreferrer"
          >
            Frontend Mentor </a
          >. Coded by <a class="site-footer__link" href="#"> Alokananda Y </a>.
        </p>
      </footer>
    </div>
  </body>
</html>
